<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Invernadero Studio. Un espacio para cultivar buenas ideas. Próximamente.">
  <meta name="theme-color" content="#242424">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Invernadero Studio — Próximamente</title>
  <style>
    :root { color-scheme: dark; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #eee9df; background: #242424; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; }
    .page { position: relative; isolation: isolate; overflow: hidden; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 30px 5vw 24px; }
    .watermark { position: absolute; z-index: -1; height: 140%; width: auto; left: -18vw; top: 50%; transform: translateY(-50%); opacity: .07; pointer-events: none; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .brand { font-weight: 700; letter-spacing: .08em; font-size: 14px; }
    .mark { display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 50%; background: #eee9df; }
    main { flex: 1; display: grid; place-items: center; padding: 70px 0; text-align: center; }
    .content { max-width: 1000px; }
    .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 28px; }
    h1 { margin: 0; font-family: Arial, sans-serif; font-weight: 700; font-size: clamp(3.4rem, 8vw, 7rem); letter-spacing: -.045em; line-height: 1.05; }
    h1 em { position: relative; display: inline-block; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-style: normal; font-weight: 200; color: #eee9df; }
    .plant { position: absolute; width: .46em; height: .64em; left: calc(100% + .06em); bottom: .02em; overflow: visible; color: #eee9df; }
    .description { max-width: 390px; margin: 40px auto 0; font-size: 15px; line-height: 1.7; color: #c5c0b7; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 40px; padding: 12px 17px; border: 1px solid #807d77; border-radius: 999px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #eee9df; }
    footer { border-top: 1px solid #55534f; padding-top: 18px; color: #b4afa6; }
    @media (max-width: 600px) { .page { padding: 24px 6vw 20px; } .watermark { height: 105%; left: 25%; transform: translate(-25%, -50%); } header, footer { font-size: 9px; } .brand { font-size: 12px; } h1 { font-size: clamp(2.7rem, 10vw, 4rem); } .plant { width: .38em; height: .52em; left: auto; right: 0; bottom: calc(100% + .12em); } .description { margin-top: 30px; } }
  </style>
</head>
<body>
  <div class="page">
    <svg class="watermark" viewBox="0 0 1600 1600" aria-hidden="true" focusable="false"><defs><filter id="logo-contrast" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="4 0 0 0 -2  0 4 0 0 -2  0 0 4 0 -2  0 0 0 1 0"/></filter><mask id="logo-mask" mask-type="luminance"><image href="/logo-fondo.jpg" width="1600" height="1600" filter="url(#logo-contrast)"/></mask></defs><rect width="1600" height="1600" fill="#eee9df" mask="url(#logo-mask)"/></svg>
    <header><span class="brand"><span class="mark" aria-hidden="true"></span>INVERNADERO STUDIO</span><span>Un espacio para crecer</span></header>
    <main>
      <div class="content">
        <p class="eyebrow">Ideas que echan raíces</p>
        <h1>Algo bueno<br><em>está creciendo.<svg class="plant" viewBox="0 0 60 84" fill="none" aria-hidden="true" focusable="false"><path d="M29 79C30 60 29 39 30 14M30 59C24 52 19 47 12 44M30 46C35 39 40 34 48 30M30 33C24 27 21 22 20 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 44C5 42 2 36 4 30C12 30 18 36 19 47M48 30C54 25 55 18 52 13C45 15 40 21 40 34M20 16C16 12 16 6 19 2C25 5 29 11 28 18" fill="currentColor" opacity=".75"/><path d="M18 79H41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></em></h1>
        <p class="description">Estamos preparando un nuevo espacio para cultivar ideas y darles vida. Pronto te contaremos más.</p>
        <span class="status">Próximamente</span>
      </div>
    </main>
    <footer><span>Invernadero Studio</span><span>Hecho con intención</span></footer>
  </div>
</body>
</html>

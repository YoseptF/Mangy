<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Invernadero Studio. Un espacio para cultivar buenas ideas. Próximamente.">
  <meta name="theme-color" content="#e7e8db">
  <title>Invernadero Studio — Próximamente</title>
  <style>
    :root { color-scheme: light; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #293d31; background: #e7e8db; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; }
    .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 30px 5vw 24px; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .brand { font-weight: 700; letter-spacing: .08em; font-size: 14px; }
    .mark { display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 50%; background: #a5b66c; }
    main { flex: 1; display: grid; place-items: center; padding: 70px 0; text-align: center; }
    .content { max-width: 1000px; }
    .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 28px; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(4.1rem, 10vw, 9.5rem); letter-spacing: -.075em; line-height: .87; }
    h1 em { font-weight: 400; color: #758b5c; }
    .description { max-width: 390px; margin: 40px auto 0; font-size: 15px; line-height: 1.7; color: #536455; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 40px; padding: 12px 17px; border: 1px solid #acb9a0; border-radius: 999px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #819b60; }
    footer { border-top: 1px solid #c3cbb8; padding-top: 18px; color: #69776a; }
    @media (max-width: 600px) { .page { padding: 24px 6vw 20px; } header, footer { font-size: 9px; } .brand { font-size: 12px; } h1 { font-size: clamp(3.5rem, 14vw, 5.5rem); } .description { margin-top: 30px; } }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="brand"><span class="mark" aria-hidden="true"></span>INVERNADERO STUDIO</span><span>Un espacio para crecer</span></header>
    <main>
      <div class="content">
        <p class="eyebrow">Ideas que echan raíces</p>
        <h1>Algo bueno<br><em>está creciendo.</em></h1>
        <p class="description">Estamos preparando un nuevo espacio para cultivar ideas y darles vida. Pronto te contaremos más.</p>
        <span class="status">Próximamente</span>
      </div>
    </main>
    <footer><span>Invernadero Studio</span><span>Hecho con intención</span></footer>
  </div>
</body>
</html>
